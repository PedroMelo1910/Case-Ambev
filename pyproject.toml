[project]
name = "occasion-intelligence"
version = "0.1.0"
description = "Occasion Score (Pizza + Guaraná): coleta, leitura e preparação da POF do IBGE"
requires-python = ">=3.12,<3.13"
# Versões do ambiente WSL (Python 3.12.15) que passou nos testes sintéticos e nos testes com microdados.
dependencies = [
    "duckdb==2.0.0",
    "scikit-learn==1.9.1",
    "xlrd==2.0.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: exige os microdados reais (CASE_AMBEV_RAW_ROOT)"]
